<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula 1 - Főoldal</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero-section">
            <h2>Üdvözöljük a Formula 1 Adatbázisban</h2>

        </section>

        <section class="media-container">
            <h3>Bemutató videók</h3>
            <div class="video-grid">
                <div class="video-item">
                    <h4>Saját felvétel</h4>
                    <video width="100%" controls muted>
                        <source src="f1video.mp4" type="video/mp4">
                        A böngésző nem támogatja a videót.
                    </video>
                </div>

                <div class="video-item">
                    <h4>Beágyazott Videó</h4>
                    <div class="iframe-container">
                        <iframe width="560" height="315"
                            src="https://www.youtube.com/embed/Kg4WMLCCBYY?si=zdyrYSvoK3vxcf85"
                            title="YouTube video player" frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </section>

        <section class="map-section">
            <h3>Helyszínünk</h3>
            <div class="map-container">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2691.036662705151!2d19.246476576880826!3d47.58661608933221!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4741db0031804c15%3A0x7d022f4625b1129b!2sHungaroring!5e0!3m2!1shu!2shu!4v1715000000000!5m2!1shu!2shu"
                    width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy">
                </iframe>
            </div>
        </section>

        <section class="crud-app">
            <div class="form-container-div">
                <div class="form-container">
                    <h3 id="createTitle">Új pálya hozzáadása</h3>
                    <input type="hidden" id="id">
                    <input type="text" id="datum" placeholder="Verseny dátuma" required>
                    <input type="text" id="nev" placeholder="Pálya neve" required>
                    <input type="text" id="helyszin" placeholder="Pálya helyszine">
                    <button onclick="create()">Mentés</button>
                    <button onclick="resetForm()" style="background-color: #6c757d;">Mégsem</button>
                </div>

                <div class="form-container">
                    <h3 id="updateTitle">pálya módosítása</h3>
                    <input type="hidden" id="editId">
                    <input type="text" id="editDatum" placeholder="Verseny dátuma" required>
                    <input type="text" id="editNev" placeholder="Pálya neve" required>
                    <input type="text" id="editHelyszin" placeholder="Pálya helyszine">
                    <button onclick="update()">Mentés</button>
                    <button onclick="resetForm('edit')" style="background-color: #6c757d;">Mégsem</button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Verseny Dátum</th>
                        <th>Pályan név</th>
                        <th>Pálya helyszíne</th>
                        <th>Műveletek</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
