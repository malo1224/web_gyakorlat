<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="index.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: block;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .contact-container {
            background: white;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        h2 {
            margin: 0 0 0.5rem 0;
            color: var(--text-color);
        }

        .subtitle {
            margin-bottom: 2rem;
            color: #64748b;
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-color);
        }

        input,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            box-sizing: border-box;
            /* Fontos a padding miatt! */
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        /* Sikeres üzenet stílusa */
        #responseMessage {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            text-align: center;
        }

        .success {
            background-color: #dcfce7;
            color: #166534;
        }

        .hidden {
            display: none;
        }

        /* Loader animáció */
        .loader {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <span id="userName"></span>
            <a href="index.html">Home</a>
            <a href="images.html">Images</a>
            <a href="contact.html">Contact</a>
            <a href="crud.html">CRUD</a>
            <a id="logintBtn" href="login.html">Login</a>
            <a id="registerBtn" href="register.html">Register</a>
            <a id="logoutBtn">Logout</a>
        </nav>
    </header>

    <div class="contact-container">
        <form id="contactForm">
            <h2>Írjon nekünk!</h2>
            <p class="subtitle">Várjuk észrevételeit vagy kérdéseit.</p>

            <div class="input-group">
                <label for="message">Üzenet</label>
                <textarea id="message" rows="5" required placeholder="Miben segíthetünk?"></textarea>
            </div>

            <button type="submit" id="submitBtn">
                <span class="btn-text">Küldés</span>
                <div class="loader" id="loader"></div>
            </button>

            <div id="responseMessage" class="hidden"></div>
        </form>
    </div>

    <div id="chat-box""></div>

</body>
<script src="nav.js"></script>
<script src="contact.js"></script>

</html>
